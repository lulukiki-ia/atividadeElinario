<meta charset="UTF-8">

<title>Fone Bluetooth Pro</title>
<style>
  * {
    box-sizing: border-box;
  }
 
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dadde0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
 
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 320px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    overflow: hidden;
  }
 
  .image-wrap {
    padding: 24px 24px 8px;
    display: flex;
    justify-content: center;
  }
 
  .image-wrap img {
    width: 100%;
    max-width: 220px;
    height: auto;
    object-fit: contain;
  }
 
  .title {
    text-align: center;
    margin: 8px 24px 4px;
    font-size: 19px;
    font-weight: 800;
    color: #1a1a1a;
  }
 
  .price {
    text-align: center;
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
    color: #2e8b3f;
  }
 
  .description {
    text-align: center;
    margin: 0 22px 20px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #555;
  }
 
  .btn-cart {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    background: #1e63d0;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
 
  .btn-cart:hover {
    filter: brightness(0.92);
  }
</style>
